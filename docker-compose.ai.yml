# Compatibility overlay: the `ai` service is now included directly in docker.yml
# and docker-compose.deploy.yml so `docker compose -f docker.yml up -d` starts it automatically.
services:
  ai:
    environment:
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:?Set a private AI_SERVICE_KEY before starting AI}
      OMP_NUM_THREADS: "1"

  app:
    environment:
      AI_SERVICE_URL: http://ai:8001
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:?Set a private AI_SERVICE_KEY before starting AI}
      AI_ENABLED: "true"
