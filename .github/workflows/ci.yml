name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Ngăn 2 job push chạy song song trên cùng commit (tiết kiệm runner).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Frontend: React + Vite + TypeScript
  # ---------------------------------------------------------------------
  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source-code/galaxy-cinema-hub-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: source-code/galaxy-cinema-hub-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint, baseline-aware)
        # Dùng baseline: lỗi lint cũ đã tồn tại được phép, lỗi MỚI thì fail.
        run: npm run lint:check

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build (Vite)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: source-code/galaxy-cinema-hub-main/dist
          retention-days: 7

  # ---------------------------------------------------------------------
  # Backend: PHP 8.2 custom MVC (chưa có PHPUnit -> dùng syntax lint)
  # ---------------------------------------------------------------------
  backend:
    name: Backend (PHP syntax + schema sanity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, zip
          coverage: none

      - name: PHP syntax check (php -l)
        run: |
          set -euo pipefail
          fail=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=$file::PHP syntax error"
              php -l "$file" || true
              fail=1
            fi
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './uploads/*' -print0)
          echo "Checked $count PHP files."
          exit $fail

      - name: Verify database schema/seed files exist
        run: |
          set -euo pipefail
          for f in database/schema.sql database/seed_data.sql database/auto_seed_current_showtimes.sql; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Missing required SQL file"
              exit 1
            fi
          done
          echo "Database assets present."

  # ---------------------------------------------------------------------
  # AI service: Python FastAPI + pytest
  # ---------------------------------------------------------------------
  ai-service:
    name: AI Service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup PHP (cho test_php_bridge)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl
          coverage: none

      - name: Run tests
        # PHP_BIN được set để test_php_bridge.py chạy thật thay vì skip.
        env:
          PHP_BIN: php
        run: python -m pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------
  # Docker: đảm bảo Dockerfile vẫn build được (backend + frontend + ai)
  # ---------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [frontend, backend, ai-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: galaxy-cinema-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./source-code/galaxy-cinema-hub-main
          file: ./source-code/galaxy-cinema-hub-main/Dockerfile
          push: false
          load: true
          tags: galaxy-cinema-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: false
          load: true
          tags: galaxy-cinema-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # Security: quét secrets lỡ commit nhầm vào repo
  # ---------------------------------------------------------------------
  security:
    name: Security (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          args: detect --redact --no-banner --report-format sarif --report-path gitleaks.sarif
        continue-on-error: true

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
        continue-on-error: true

  # ---------------------------------------------------------------------
  # Tổng hợp trạng thái CI (dùng cho branch protection)
  # ---------------------------------------------------------------------
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    if: always()
    needs: [frontend, backend, ai-service, docker, security]
    steps:
      - name: Check required jobs
        run: |
          echo "frontend=${{ needs.frontend.result }}"
          echo "backend=${{ needs.backend.result }}"
          echo "ai-service=${{ needs.ai-service.result }}"
          echo "docker=${{ needs.docker.result }}"
          echo "security=${{ needs.security.result }}"
          if [ "${{ needs.frontend.result }}" != "success" ] \
          || [ "${{ needs.backend.result }}" != "success" ] \
          || [ "${{ needs.ai-service.result }}" != "success" ] \
          || [ "${{ needs.docker.result }}" != "success" ]; then
            echo "::error::CI failed"
            exit 1
          fi
          echo "All required CI jobs passed."
