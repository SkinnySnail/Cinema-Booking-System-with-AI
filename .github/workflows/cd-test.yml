name: CD
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          echo "backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "ai=ghcr.io/${{ github.repository }}/ai-service:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./source-code/galaxy-cinema-hub-main
          file: ./source-code/galaxy-cinema-hub-main/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.frontend }}

      - name: Build & push AI service
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.ai }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

