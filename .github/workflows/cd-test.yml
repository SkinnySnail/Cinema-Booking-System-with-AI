name: CD
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_ai:
        description: 'Deploy AI service too? (true/false)'
        required: false
        default: 'false'
      skip_migrations:
        description: 'Skip auto-seed showtime SQL? (true/false)'
        required: false
        default: 'false'
concurrency:
  group: cd-production
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ping ok"
