name: CD
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_ai:
        description: 'Deploy AI service too? (true/false)'
        required: false
        default: 'false'
      skip_migrations:
        description: 'Skip auto-seed showtime SQL? (true/false)'
        required: false
        default: 'false'
concurrency:
  group: cd-production
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.meta.outputs.backend }}
      frontend_image: ${{ steps.meta.outputs.frontend }}
      ai_image: ${{ steps.meta.outputs.ai }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          echo "backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "ai=ghcr.io/${{ github.repository }}/ai-service:${{ github.sha }}" >> "$GITHUB_OUTPUT"
