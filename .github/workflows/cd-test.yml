name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_ai:
        description: 'Deploy AI service too? (true/false)'
        required: false
        default: 'false'
      skip_migrations:
        description: 'Skip auto-seed showtime SQL? (true/false)'
        required: false
        default: 'false'

# Khxng cho 2 deploy chxy xxng thxi trxn cxng server.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------
  # 1. Build & push Docker images lxn GitHub Container Registry
  # ---------------------------------------------------------------------
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.meta.outputs.backend }}
      frontend_image: ${{ steps.meta.outputs.frontend }}
      ai_image: ${{ steps.meta.outputs.ai }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          echo "backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "ai=ghcr.io/${{ github.repository }}/ai-service:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./source-code/galaxy-cinema-hub-main
          file: ./source-code/galaxy-cinema-hub-main/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.frontend }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_PUSHER_KEY=${{ vars.VITE_PUSHER_KEY }}
            VITE_PUSHER_CLUSTER=${{ vars.VITE_PUSHER_CLUSTER }}
            VITE_MAPTILER_KEY=${{ vars.VITE_MAPTILER_KEY }}
            VITE_ORS_API_KEY=${{ vars.VITE_ORS_API_KEY }}
            VITE_ORS_API_KEY_2=${{ vars.VITE_ORS_API_KEY_2 }}

      - name: Build & push AI service
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.ai }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # 2. Deploy lxn server qua SSH (cxn approve thx cxng)
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<EOF
          Host deploy-server
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      - name: Deploy via SSH
        run: |
          set -euo pipefail
          # Bixn xxxc truyxn sang mxy chx qua chxnh lxnh `env` phxa trxxc
          # script (khxng phx thuxc SendEnv/AcceptEnv trxn sshd).
          ssh deploy-server "env \
            DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' \
            BACKEND_IMAGE='${{ needs.build.outputs.backend_image }}' \
            FRONTEND_IMAGE='${{ needs.build.outputs.frontend_image }}' \
            AI_IMAGE='${{ needs.build.outputs.ai_image }}' \
            DEPLOY_AI='${{ github.event.inputs.deploy_ai || 'false' }}' \
            SKIP_MIGRATIONS='${{ github.event.inputs.skip_migrations || 'false' }}' \
            GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            GHCR_USER='${{ github.actor }}' \
            bash -s" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/galaxy-cinema}"
          BACKEND_IMAGE="${BACKEND_IMAGE}"
          FRONTEND_IMAGE="${FRONTEND_IMAGE}"
          AI_IMAGE="${AI_IMAGE}"
          DEPLOY_AI="${DEPLOY_AI:-false}"
          SKIP_MIGRATIONS="${SKIP_MIGRATIONS:-false}"

          cd "$DEPLOY_PATH"

          # --- 1. Login GHCR xx pull image ---
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # --- 2. Backup .env trxxc khi ghi ---
          if [ -f .env ]; then
            cp .env ".env.bak.$(date +%Y%m%d%H%M%S)"
          fi

          # --- 3. Ghi .env (gix nguyxn cxc bixn khxng nxm trong danh sxch dxxi) ---
          set_env() {
            key="$1"; value="$2"
            if [ -f .env ]; then
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                printf '\n%s=%s\n' "$key" "$value" >> .env
              fi
            else
              printf '%s=%s\n' "$key" "$value" >> .env
            fi
          }
          set_env BACKEND_IMAGE "$BACKEND_IMAGE"
          set_env FRONTEND_IMAGE "$FRONTEND_IMAGE"
          set_env AI_IMAGE "$AI_IMAGE"

          # --- 4. Pull image mxi ---
          docker pull "$BACKEND_IMAGE"
          docker pull "$FRONTEND_IMAGE"
          if [ "$DEPLOY_AI" = "true" ]; then
            docker pull "$AI_IMAGE"
          fi

          # --- 5. Chxy migration / seed dx lixu ---
          if [ "$SKIP_MIGRATIONS" != "true" ]; then
            echo ">> Applying database migrations..."
            # xxc cxu hxnh DB tx .env trxn server (bixn chxa export sxn).
            DB_NAME_CFG="$(awk -F= '/^MYSQL_DATABASE=/{print $2}' .env | tail -1)"
            DB_PASS_CFG="$(awk -F= '/^MYSQL_ROOT_PASSWORD=/{print $2}' .env | tail -1)"
            docker compose -f docker-compose.deploy.yml exec -T db mysql \
              -uroot -p"${DB_PASS_CFG:-123456}" "${DB_NAME_CFG:-galaxy_cinema}" \
              < backend/database/auto_seed_current_showtimes.sql
          fi

          # --- 6. Restart service ---
          echo ">> Restarting services..."
          docker compose -f docker-compose.deploy.yml up -d --remove-orphans --no-build
          docker compose -f docker-compose.deploy.yml ps

          # --- 7. Health check ---
          echo ">> Waiting for health..."
          BE_PORT="$(awk -F= '/^BACKEND_PORT=/{print $2}' .env | tail -1)"
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${BE_PORT:-8000}/api/health" > /dev/null; then
              echo "Backend healthy after ${i}0s"
              break
            fi
            sleep 10
          done
          curl -fsS "http://127.0.0.1:${BE_PORT:-8000}/api/health" || {
            echo "::error::Backend health check failed"
            docker compose -f docker-compose.deploy.yml logs --tail=100 backend
            exit 1
          }

          echo ">> Deploy completed."
          REMOTE

      - name: Rollback on failure
        if: failure()
        run: |
          set -euo pipefail
          ssh deploy-server "env DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${DEPLOY_PATH:-/opt/galaxy-cinema}"
          echo ">> Rolling back to last backup..."
          if [ -f .env ] && ls .env.bak.* > /dev/null 2>&1; then
            LATEST=$(ls -t .env.bak.* | head -1)
            cp "$LATEST" .env
            echo "Restored $LATEST"
          fi
          docker compose -f docker-compose.deploy.yml up -d --remove-orphans --no-build || true
          REMOTE
