name: CD
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.meta.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Image metadata
        id: meta
        run: |
          echo "backend=ghcr.io/x/backend:sha" >> "$GITHUB_OUTPUT"
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend }}
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
