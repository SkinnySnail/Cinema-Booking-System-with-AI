jobs:
  build:
    name: Build & push images
    outputs:
      ai_image: ${{ steps.meta.outputs.ai }}
      backend_image: ${{ steps.meta.outputs.backend }}
      frontend_image: ${{ steps.meta.outputs.frontend }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ghcr.io
        username: ${{ github.actor }}
    - id: meta
      name: Image metadata
      run: 'set -euo pipefail

        echo "backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }}"
        >> "$GITHUB_OUTPUT"

        echo "frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}"
        >> "$GITHUB_OUTPUT"

        echo "ai=ghcr.io/${{ github.repository }}/ai-service:${{ github.sha }}" >>
        "$GITHUB_OUTPUT"

        '
    - name: Build & push backend
      uses: docker/build-push-action@v6
      with:
        cache-from: type=gha
        cache-to: type=gha,mode=max
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.backend }}
    - name: Build & push frontend
      uses: docker/build-push-action@v6
      with:
        build-args: 'VITE_API_URL=${{ vars.VITE_API_URL }}

          VITE_PUSHER_KEY=${{ vars.VITE_PUSHER_KEY }}

          VITE_PUSHER_CLUSTER=${{ vars.VITE_PUSHER_CLUSTER }}

          VITE_MAPTILER_KEY=${{ vars.VITE_MAPTILER_KEY }}

          VITE_ORS_API_KEY=${{ vars.VITE_ORS_API_KEY }}

          VITE_ORS_API_KEY_2=${{ vars.VITE_ORS_API_KEY_2 }}

          '
        context: ./source-code/galaxy-cinema-hub-main
        file: ./source-code/galaxy-cinema-hub-main/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.frontend }}
name: CD
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      deploy_ai:
        default: 'false'
        description: Deploy AI service too? (true/false)
        required: false
      skip_migrations:
        default: 'false'
        description: Skip auto-seed showtime SQL? (true/false)
        required: false
permissions:
  contents: read
  packages: write
