name: CD
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        run: |
          set -euo pipefail
          ssh deploy-server "env DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${DEPLOY_PATH:-/opt/galaxy-cinema}"
          echo ">> Deploy completed."
          REMOTE
