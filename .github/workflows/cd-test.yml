name: CD
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./source-code/galaxy-cinema-hub-main
          file: ./source-code/galaxy-cinema-hub-main/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_PUSHER_KEY=${{ vars.VITE_PUSHER_KEY }}
