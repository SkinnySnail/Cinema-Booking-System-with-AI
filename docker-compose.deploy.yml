services:
  db:
    image: mysql:8.0
    container_name: galaxy_cinema_db
    restart: unless-stopped
    command: --default-time-zone=+07:00 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-galaxy_cinema}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      # Host port only; DB_PORT is the backend's connection port (3306 inside Docker).
      - "${CINEMA_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
      # Chạy tự động đúng 1 lần khi volume còn trống: sinh lịch chiếu theo ngày hiện tại.
      - ./backend/database/auto_seed_current_showtimes.sql:/docker-entrypoint-initdb.d/03_auto_seed_current_showtimes.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-123456}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    # image: dùng khi CI/CD đã push image lên GHCR (xem BACKEND_IMAGE trong .env).
    # build:  dùng khi chạy tay, không có image dựng sẵn.
    image: ${BACKEND_IMAGE:-}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galaxy_cinema_backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 8080
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-galaxy_cinema}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      DB_CHARSET: utf8mb4
      # MySQL trong container nghe ở 3306. Cổng mở ra host là CINEMA_DB_PORT.
      DB_PORT: "3306"
    ports:
      - "${BACKEND_PORT:-8000}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/api/health') ? 0 : 1);" ]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    # image: dùng khi CI/CD đã push image lên GHCR (xem FRONTEND_IMAGE trong .env).
    # build:  dùng khi chạy tay, không có image dựng sẵn.
    image: ${FRONTEND_IMAGE:-}
    build:
      context: ./source-code/galaxy-cinema-hub-main
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_PUSHER_KEY: ${VITE_PUSHER_KEY:-}
        VITE_PUSHER_CLUSTER: ${VITE_PUSHER_CLUSTER:-ap1}
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY:-}
        VITE_ORS_API_KEY: ${VITE_ORS_API_KEY:-}
        VITE_ORS_API_KEY_2: ${VITE_ORS_API_KEY_2:-}
    container_name: galaxy_cinema_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
