services:
  db:
    image: mysql:8.0
    container_name: galaxy_cinema_db
    restart: unless-stopped
    ports:
      - "${CINEMA_DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "12345678"
      MYSQL_DATABASE: "galaxy_cinema"
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    command: --default-time-zone=+07:00 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: galaxy_cinema_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DB_HOST: db
      DB_DRIVER: mysql
      DB_NAME: galaxy_cinema
      DB_USER: root
      DB_PASSWORD: "12345678"
      DB_CHARSET: utf8mb4
    ports:
      - "${CINEMA_API_PORT:-8000}:8000"
    depends_on:
      - db
    command: php -S 0.0.0.0:8000 -t /app/backend /app/backend/index.php

  api-test:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: galaxy_cinema_api_test
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      API_BASE_URL: http://app:8000
    depends_on:
      - app
      - db
    command: php /app/scripts/test_api.php
    restart: "no"

  frontend:
    image: node:20-bullseye-slim
    container_name: galaxy_cinema_frontend
    working_dir: /app
    volumes:
      - ./source-code/galaxy-cinema-hub-main:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: "http://localhost:${CINEMA_API_PORT:-8000}"
    ports:
      - "${CINEMA_WEB_PORT:-8080}:8080"
    depends_on:
      - app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8080"

volumes:
  mysql_data:
